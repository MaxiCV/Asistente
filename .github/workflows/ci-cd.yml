name: CI/CD Asistente

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Verificacion (Ruff, Pytest, Frontend)
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports:
          - 6333:6333
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Instalar uv y sincronizar dependencias
        run: |
          python -m pip install --upgrade pip uv==0.13.7
          uv sync --frozen

      - name: Comprobar Ruff y ejecutar Pytest (unitarias e integracion)
        env:
          QDRANT_TEST_URL: http://127.0.0.1:6333
        run: |
          uv run ruff check backend
          uv run ruff format --check backend
          uv run pytest -q -m "not integration"
          uv run pytest -q -m integration

      - name: Configurar Node 24.21.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar Frontend
        run: |
          npm --prefix frontend ci --no-fund --no-audit
          npm --prefix frontend run build

  cd:
    name: Despliegue en VM Google Cloud
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: cd-gcp-vm
      cancel-in-progress: false
    steps:
      - name: Preparar y validar clave SSH
        env:
          HOST: ${{ secrets.GCP_VM_HOST }}
          USERNAME: ${{ secrets.GCP_VM_USER }}
          RAW_SSH_KEY: ${{ secrets.GCP_VM_SSH_KEY }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          host = os.environ.get("HOST", "").strip()
          username = os.environ.get("USERNAME", "").strip()
          raw = os.environ.get("RAW_SSH_KEY", "").lstrip("\ufeff").strip()

          missing = [
              name
              for name, val in [
                  ("GCP_VM_HOST", host),
                  ("GCP_VM_USER", username),
                  ("GCP_VM_SSH_KEY", raw),
              ]
              if not val
          ]
          if missing:
              print(f"::error::Faltan secretos de despliegue en GitHub Actions: {', '.join(missing)}", file=sys.stderr)
              sys.exit(1)

          if len(raw) >= 2 and raw[0] == raw[-1] and raw[0] in {"'", '"'}:
              raw = raw[1:-1].strip()

          if "-----BEGIN " not in raw:
              try:
                  decoded = base64.b64decode(raw, validate=False).decode("utf-8", errors="ignore").strip()
                  if "-----BEGIN " in decoded:
                      raw = decoded
              except Exception:
                  pass

          raw = raw.replace("\r\n", "\n").replace("\r", "\n")
          if "\\n" in raw and raw.count("\n") < 2:
              raw = raw.replace("\\n", "\n")

          single_line_pem = re.match(
              r"^(-----BEGIN [A-Z0-9 ]+-----)\s+(.+?)\s+(-----END [A-Z0-9 ]+-----)$",
              raw,
              flags=re.DOTALL,
          )
          if single_line_pem and "\n" not in single_line_pem.group(2).strip():
              header, body, footer = single_line_pem.groups()
              compact_body = "".join(body.split())
              wrapped = "\n".join(compact_body[i : i + 70] for i in range(0, len(compact_body), 70))
              raw = f"{header}\n{wrapped}\n{footer}"

          if raw.startswith(("ssh-rsa ", "ssh-ed25519 ", "ecdsa-sha2-")):
              print(
                  "::error::El secreto GCP_VM_SSH_KEY contiene una clave publica SSH (ssh-rsa/ssh-ed25519). "
                  "Debe configurarse la clave privada PEM/OpenSSH completa.",
                  file=sys.stderr,
              )
              sys.exit(1)

          if raw.startswith("PuTTY-User-Key-File-"):
              print(
                  "::error::El secreto GCP_VM_SSH_KEY esta en formato PuTTY (.ppk). "
                  "Debe exportarse como clave privada OpenSSH (-----BEGIN OPENSSH PRIVATE KEY-----).",
                  file=sys.stderr,
              )
              sys.exit(1)

          if "-----BEGIN " not in raw or "-----END " not in raw:
              print(
                  "::error::El secreto GCP_VM_SSH_KEY no contiene encabezados PEM validos "
                  "(-----BEGIN ... PRIVATE KEY----- / -----END ... PRIVATE KEY-----).",
                  file=sys.stderr,
              )
              sys.exit(1)

          key_path = Path(os.environ["RUNNER_TEMP"]) / "deploy_key"
          key_path.write_text(raw.strip() + "\n", encoding="utf-8")
          key_path.chmod(0o600)

          check = subprocess.run(
              ["ssh-keygen", "-y", "-f", str(key_path)],
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )
          if check.returncode != 0:
              err = (check.stderr or "formato invalido").strip().splitlines()[0]
              print(f"::error::El secreto GCP_VM_SSH_KEY no es una clave privada SSH valida ({err}).", file=sys.stderr)
              sys.exit(1)

          fp = subprocess.run(
              ["ssh-keygen", "-l", "-f", str(key_path)],
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )
          if fp.returncode == 0 and fp.stdout.strip():
              print(f"Clave SSH validada: {fp.stdout.strip()}")
          PY

      - name: Actualizar codigo y contenedores por SSH
        env:
          HOST: ${{ secrets.GCP_VM_HOST }}
          USERNAME: ${{ secrets.GCP_VM_USER }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          HOST_CLEAN="$(printf '%s' "$HOST" | tr -d '\r\n[:space:]')"
          USER_CLEAN="$(printf '%s' "$USERNAME" | tr -d '\r\n[:space:]')"
          ssh \
            -i "${RUNNER_TEMP}/deploy_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "${USER_CLEAN}@${HOST_CLEAN}" \
            "set -e && cd ~/Asistente && git fetch origin main && git reset --hard '${TARGET_SHA}' && docker compose up -d --build api web"

      - name: Limpiar clave SSH temporal
        if: always()
        run: rm -f "${{ runner.temp }}/deploy_key"

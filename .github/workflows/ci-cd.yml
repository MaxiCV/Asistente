name: CI/CD Asistente

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Verificacion (Ruff, Pytest, Frontend)
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports:
          - 6333:6333
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Instalar uv y sincronizar dependencias
        run: |
          python -m pip install --upgrade pip uv==0.13.7
          uv sync --frozen

      - name: Comprobar Ruff y ejecutar Pytest (unitarias e integracion)
        env:
          QDRANT_TEST_URL: http://127.0.0.1:6333
        run: |
          uv run ruff check backend
          uv run ruff format --check backend
          uv run pytest -q
          uv run pytest -q -m integration

      - name: Configurar Node 24.21.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar Frontend
        run: |
          npm --prefix frontend ci --no-fund --no-audit
          npm --prefix frontend run build

  cd:
    name: Despliegue en VM Google Cloud
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Actualizar codigo y contenedores por SSH
        if: env.HOST != ''
        env:
          HOST: ${{ secrets.GCP_VM_HOST }}
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd ~/Asistente
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build api web
